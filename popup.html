<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CaseCapture OSINT</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>CaseCapture OSINT</h1>

  <label>Case Number</label>
  <input id="caseNumber" type="text" placeholder="26-12345">

  <label>Item / Evidence Number</label>
  <input id="itemNumber" type="text" placeholder="Item 1">

  <label>Investigator</label>
  <input id="investigator" type="text" placeholder="Det. Name">

  <label>Agency</label>
  <input id="agency" type="text" placeholder="Agency Name">

  <label>Notes</label>
  <textarea id="notes" placeholder="Brief investigator notes..."></textarea>

  <button id="captureBtn">Capture Current Page</button>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
