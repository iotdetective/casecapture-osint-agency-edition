<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CaseCapture OSINT</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>CaseCapture OSINT</h1>

  <div class="saved-case-controls">
    <button id="useLastCaseBtn" class="secondary" type="button">Use Last Case Information</button>
    <button id="clearSavedCaseBtn" class="tertiary" type="button">Clear Saved Case Information</button>
    <p class="helper-text">Saved case information is loaded only when you choose to reuse it. Review all fields before capture. Investigator notes are never retained for reuse.</p>
  </div>

  <label>Case Number</label>
  <input id="caseNumber" type="text" placeholder="26-12345">

  <label>Item / Evidence Number</label>
  <input id="itemNumber" type="text" placeholder="Item 1">

  <label>Investigator</label>
  <input id="investigator" type="text" placeholder="Det. Name">

  <label>Agency</label>
  <input id="agency" type="text" placeholder="Agency Name">

  <label>Notes</label>
  <textarea id="notes" placeholder="Brief investigator notes..."></textarea>

  <button id="captureBtn">Capture Current Page</button>
  <button id="openSupplementBtn" class="secondary">Open Last Investigator Supplement</button>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
